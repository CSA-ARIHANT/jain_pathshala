<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>जैन पाठशाला</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --sky:#e0f2fe;--sky-mid:#bae6fd;--sky-dark:#0369a1;--sky-deeper:#075985;
  --navy:#0c1a2e;--navy-mid:#1e3a5f;--gold:#f59e0b;--gold-light:#fcd34d;
  --white:#fff;--r:10px;--rl:14px;
}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--sky);color:var(--navy-mid);min-height:100vh;display:flex;flex-direction:column;}
.app-header{background:linear-gradient(135deg,#0c4a6e,#075985);border-bottom:3px solid var(--gold);padding:12px 20px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:100;}
.logo{width:48px;height:48px;background:var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--navy);font-weight:900;border:2px solid var(--white);flex-shrink:0;}
.title-group h1{font-size:20px;font-weight:700;color:var(--gold-light);}
.title-group p{font-size:11px;color:#bae6fd;margin-top:2px;}
.header-right{margin-left:auto;flex-shrink:0;}
.title-group{min-width:0;flex:1;}
.title-group h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
@media(max-width:480px){
  .app-header{padding:10px 12px;gap:8px;}
  .logo{width:36px;height:36px;font-size:16px;}
  .title-group h1{font-size:15px;}
  .title-group p{font-size:9px;}
  #liveClock{display:none!important;}
  .btn-logout{padding:6px 10px;font-size:12px;}
}
.app-main{flex:1;padding:20px 16px;max-width:1100px;margin:0 auto;width:100%;}
.app-footer{background:linear-gradient(135deg,#0c4a6e,#075985);border-top:3px solid var(--gold);text-align:center;padding:12px;font-size:13px;color:#bae6fd;font-weight:600;}
/* BUTTONS 3D */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:var(--r);cursor:pointer;font-size:14px;font-weight:700;position:relative;top:0;transition:all .12s;padding:9px 18px;}
.btn-gold{background:linear-gradient(160deg,#fcd34d,#f59e0b);color:#0c1a2e;box-shadow:0 6px 0 #b45309,0 8px 12px rgba(180,83,9,.3);}
.btn-gold:hover{top:3px;box-shadow:0 3px 0 #b45309,0 5px 8px rgba(180,83,9,.2);}
.btn-gold:active{top:6px;box-shadow:0 1px 0 #b45309;}
.btn-sky{background:linear-gradient(160deg,#38bdf8,#0369a1);color:#fff;box-shadow:0 6px 0 #075985,0 8px 12px rgba(7,89,133,.3);}
.btn-sky:hover{top:3px;box-shadow:0 3px 0 #075985,0 5px 8px rgba(7,89,133,.2);}
.btn-sky:active{top:6px;box-shadow:0 1px 0 #075985;}
.btn-red{background:linear-gradient(160deg,#fca5a5,#dc2626);color:#fff;box-shadow:0 6px 0 #991b1b,0 8px 12px rgba(153,27,27,.3);}
.btn-red:hover{top:3px;box-shadow:0 3px 0 #991b1b;}
.btn-red:active{top:6px;box-shadow:0 1px 0 #991b1b;}
.btn-green{background:linear-gradient(160deg,#86efac,#16a34a);color:#fff;box-shadow:0 6px 0 #15803d,0 8px 12px rgba(21,128,61,.3);}
.btn-green:hover{top:3px;box-shadow:0 3px 0 #15803d;}
.btn-green:active{top:6px;box-shadow:0 1px 0 #15803d;}
.btn-ghost{background:rgba(255,255,255,.7);color:var(--sky-deeper);border:1.5px solid var(--sky-mid);box-shadow:0 4px 0 #7dd3fc,0 6px 8px rgba(3,105,161,.1);}
.btn-ghost:hover{top:2px;box-shadow:0 2px 0 #7dd3fc;}
.btn-ghost:active{top:4px;box-shadow:0 1px 0 #7dd3fc;}
.btn-sm{padding:5px 11px;font-size:12px;}
.btn-w{width:100%;}
.btn-logout{background:linear-gradient(160deg,#fcd34d,#f59e0b);color:#0c1a2e;border:none;border-radius:6px;padding:6px 14px;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 4px 0 #b45309;position:relative;top:0;transition:all .12s;}
.btn-logout:hover{top:2px;box-shadow:0 2px 0 #b45309;}
/* CARDS */
.card{background:#fff;border:1.5px solid var(--sky-mid);border-radius:var(--rl);padding:20px;box-shadow:0 4px 16px rgba(3,105,161,.1);}
.card-title{color:var(--sky-deeper);font-size:16px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
/* STAT */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:18px;}
.stat-card{background:linear-gradient(135deg,#0c4a6e,#075985);border-radius:var(--r);padding:14px;text-align:center;box-shadow:0 4px 0 #0c2a4a,0 6px 12px rgba(12,42,78,.3);}
.sc-val{font-size:24px;font-weight:700;color:var(--gold-light);}
.sc-label{font-size:11px;color:#bae6fd;margin-top:3px;}
/* TABS */
.tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap;}
.tab{padding:7px 16px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;background:#fff;border:1.5px solid #7dd3fc;color:var(--sky-deeper);box-shadow:0 4px 0 #7dd3fc,0 6px 8px rgba(3,105,161,.1);position:relative;top:0;transition:all .12s;}
.tab.active{background:linear-gradient(160deg,#fcd34d,#f59e0b);color:var(--navy);border-color:#f59e0b;box-shadow:0 2px 0 #b45309;top:2px;}
.tab:hover:not(.active){top:2px;box-shadow:0 2px 0 #7dd3fc;}
/* PIN */
.pin-display{display:flex;gap:10px;justify-content:center;margin:14px 0;}
.pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--gold);background:transparent;transition:background .15s;}
.pin-dot.filled{background:var(--gold);}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:220px;margin:0 auto;}
.pin-key{padding:13px;text-align:center;cursor:pointer;background:linear-gradient(160deg,#fff,#e0f2fe);border:1.5px solid #7dd3fc;border-radius:8px;font-size:20px;font-weight:700;color:var(--sky-deeper);box-shadow:0 5px 0 #7dd3fc,0 7px 10px rgba(3,105,161,.15);position:relative;top:0;transition:all .12s;user-select:none;}
.pin-key:hover{top:2px;box-shadow:0 3px 0 #7dd3fc;}
.pin-key:active{top:5px;box-shadow:0 1px 0 #7dd3fc;}
/* TABLE */
table{width:100%;border-collapse:collapse;font-size:13px;border:1px solid #e0f2fe;}
th{background:#e0f2fe;color:var(--sky-deeper);font-weight:700;padding:9px 10px;text-align:left;border-bottom:2px solid #7dd3fc;border-right:1px solid #bae6fd;}
th:last-child{border-right:none;}
td{padding:8px 10px;border-bottom:1px solid #bae6fd;border-right:1px solid #bae6fd;vertical-align:middle;color:var(--navy-mid);}
td:last-child{border-right:none;}
tr:hover td{background:#fef3c7;}
.table-wrap{overflow-x:auto;border-radius:var(--r);}
/* FORMS */
.form-group{margin-bottom:13px;}
.form-group label{display:block;font-size:12px;color:#64748b;margin-bottom:5px;font-weight:600;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
input,select{width:100%;padding:9px 12px;border-radius:8px;background:#f0f9ff;border:1.5px solid #7dd3fc;color:var(--navy-mid);font-size:14px;}
input:focus,select:focus{outline:none;border-color:var(--sky-dark);box-shadow:0 0 0 3px rgba(3,105,161,.15);}
select option{background:#fff;}
/* ATTENDANCE */
.att-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #e0f2fe;}
.att-row:last-child{border-bottom:none;}
.att-name{flex:1;font-size:13px;font-weight:500;color:var(--navy-mid);}
.att-p{width:38px;height:38px;border-radius:8px;border:none;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#86efac,#16a34a);color:#fff;box-shadow:0 4px 0 #15803d;position:relative;top:0;transition:all .12s;}
.att-p:hover{top:2px;box-shadow:0 2px 0 #15803d;}
.att-p:active{top:4px;box-shadow:0 1px 0 #15803d;}
.att-p.on{background:linear-gradient(160deg,#4ade80,#16a34a);box-shadow:0 2px 0 #15803d;top:2px;}
.att-a{width:38px;height:38px;border-radius:8px;border:none;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#fca5a5,#dc2626);color:#fff;box-shadow:0 4px 0 #991b1b;position:relative;top:0;transition:all .12s;}
.att-a:hover{top:2px;box-shadow:0 2px 0 #991b1b;}
.att-a:active{top:4px;box-shadow:0 1px 0 #991b1b;}
.att-a.on{background:linear-gradient(160deg,#f87171,#dc2626);box-shadow:0 2px 0 #991b1b;top:2px;}
.locked-tag{font-size:10px;background:#fef3c7;border:1px solid #f59e0b;color:#92400e;border-radius:4px;padding:2px 6px;margin-left:5px;}
/* STARS */
.stars{display:inline-flex;gap:3px;}
.star{color:#bae6fd;font-size:22px;cursor:pointer;transition:color .1s;}
.star.on{color:var(--gold);}
/* ALERTS */
.alert{padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:12px;}
.alert-err{background:#fef2f2;border:1.5px solid #fca5a5;color:#991b1b;}
.alert-ok{background:#f0fdf4;border:1.5px solid #86efac;color:#15803d;}
.alert-info{background:#eff6ff;border:1.5px solid #93c5fd;color:#1d4ed8;}
.alert-warn{background:#fffbeb;border:1.5px solid #fcd34d;color:#92400e;}
/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(12,26,46,.7);display:flex;align-items:flex-start;justify-content:center;z-index:200;padding:30px 16px;overflow-y:auto;}
.modal-bg.hidden{display:none;}
.modal{background:#fff;border:2px solid var(--sky-mid);border-radius:var(--rl);padding:24px;width:100%;max-width:500px;margin:auto;box-shadow:0 20px 40px rgba(12,26,46,.3);}
.modal h3{color:var(--sky-deeper);font-size:17px;font-weight:700;margin-bottom:18px;}
/* MISC */
.empty{text-align:center;padding:36px 16px;color:#64748b;}
.empty div{font-size:36px;margin-bottom:10px;}
.spinner{border:3px solid #bae6fd;border-top-color:var(--sky-dark);border-radius:50%;width:32px;height:32px;animation:spin .8s linear infinite;margin:40px auto;}
@keyframes spin{to{transform:rotate(360deg);}}
.back-btn{display:inline-flex;align-items:center;gap:6px;color:var(--sky-deeper);cursor:pointer;font-size:14px;font-weight:700;margin-bottom:18px;background:none;border:none;padding:0;}
.section-title{font-size:17px;font-weight:700;color:var(--sky-deeper);margin-bottom:14px;}
.hidden{display:none!important;}
.flex{display:flex;}.gap-2{gap:8px;}.gap-3{gap:12px;}.items-center{align-items:center;}.justify-between{justify-content:space-between;}.flex-wrap{flex-wrap:wrap;}
.mt-3{margin-top:12px;}.mb-3{margin-bottom:12px;}.text-center{text-align:center;}
.month-bar{display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap;}
.month-bar select{width:auto;min-width:130px;}
.login-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;max-width:680px;margin:0 auto;}
.lcard{background:linear-gradient(160deg,#fff,#e0f2fe);border:1.5px solid var(--sky-mid);border-radius:var(--rl);padding:26px 18px;text-align:center;cursor:pointer;box-shadow:0 8px 0 #7dd3fc,0 10px 16px rgba(3,105,161,.2);position:relative;top:0;transition:all .15s;}
.lcard:hover{top:3px;box-shadow:0 5px 0 #7dd3fc,0 7px 12px rgba(3,105,161,.2);}
.lcard:active{top:8px;box-shadow:0 1px 0 #7dd3fc;}
.lcard .ic{font-size:40px;margin-bottom:10px;}
.lcard h3{color:var(--sky-deeper);font-size:15px;font-weight:700;margin-bottom:4px;}
.lcard p{font-size:11px;color:#64748b;}
.award-card{background:linear-gradient(135deg,#0c4a6e,#075985);border-radius:var(--rl);padding:18px;text-align:center;box-shadow:0 4px 12px rgba(12,42,78,.3);}
.award-card .tr{font-size:36px;margin-bottom:8px;}
.award-card h4{color:var(--gold-light);font-size:14px;font-weight:700;}
.chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1.5px solid #7dd3fc;border-radius:8px;padding:6px 14px;font-size:13px;color:var(--sky-deeper);font-weight:600;cursor:pointer;box-shadow:0 4px 0 #7dd3fc;position:relative;top:0;transition:all .12s;margin:3px;}
.chip:hover{top:2px;box-shadow:0 2px 0 #7dd3fc;}
.chip:active{top:4px;box-shadow:0 1px 0 #7dd3fc;}
.confirm-box{background:#fffbeb;border:2px solid #fcd34d;border-radius:var(--r);padding:18px;text-align:center;margin-bottom:16px;}
.confirm-box .ci{font-size:36px;margin-bottom:8px;}
.confirm-box p{color:#92400e;font-size:14px;line-height:1.6;}
@media(max-width:600px){.app-main{padding:14px 10px;}.form-row{grid-template-columns:1fr;}.lcard{padding:18px 12px;}}
</style>
</head>
<body>
<header class="app-header">
  <div class="logo">ॐ</div>
  <div class="title-group"><h1>जैन पाठशाला</h1><p>श्री अरिहंत विकास समिति</p></div>
  <div id="liveClock" class="hidden" style="margin-left:16px;font-size:12px;color:#bae6fd;white-space:nowrap;"></div>
  <div id="liveOnlineDiv" style="margin-left:12px;font-size:12px;color:#bae6fd;white-space:nowrap;">🟢 अभी ऑनलाइन: <b id="liveOnlineCount">-</b></div>
  <div class="header-right">
    <button class="btn-logout hidden" id="logoutBtn" onclick="logout()">लॉगआउट</button>
  </div>
</header>
<main class="app-main" id="appMain"><div class="spinner"></div></main>
<footer class="app-footer">🙏 श्री अरिहंत विकास समिति, चन्द्र शेखर आजाद नगर, भीलवाड़ा, राजस्थान 🙏</footer>
<div class="modal-bg hidden" id="modalBg"><div class="modal" id="modalBox"></div></div>

<script src="config.js"></script>
<script>
// SUPABASE_URL and SUPABASE_KEY now come from config.js (loaded above)
const API=SUPABASE_URL+'/rest/v1/';
const H={'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Prefer':'return=representation'};

let ME=null;

async function db(path,method='GET',body=null,extra={}){
  const opts={method,headers:{...H,...extra}};
  if(body) opts.body=JSON.stringify(body);
  console.log('DB CALL:',method,path,body||'');
  const r=await fetch(API+path,opts);
  if(!r.ok){
    const e=await r.json().catch(()=>({message:r.statusText}));
    console.error('DB ERROR:',r.status,e);
    throw new Error((e.message||r.statusText)+(e.hint?(' | Hint: '+e.hint):'')+(e.details?(' | '+e.details):''));
  }
  if(r.status===204) return null;
  const data=await r.json().catch(()=>null);
  console.log('DB RESULT:',data);
  return data;
}
const dbGet=p=>db(p);
const dbPost=(p,b)=>db(p,'POST',b);
const dbPatch=(p,b)=>db(p,'PATCH',b);
const dbDelete=p=>db(p,'DELETE');
const dbUpsert=(p,b)=>db(p,'POST',b,{'Prefer':'resolution=merge-duplicates,return=representation'});

window.addEventListener('load',()=>{
  const s=sessionStorage.getItem('jpMe');
  if(s)try{ME=JSON.parse(s);}catch(e){}
  ME?routeMe():showLanding();
  startClock();
  liveTick();
  setInterval(liveTick,20000);
});

// ── LIVE ONLINE COUNTER ──────────────────────
function getSessionId(){
  let sid=sessionStorage.getItem('jpSessionId');
  if(!sid){
    sid=(crypto.randomUUID?crypto.randomUUID():'s-'+Date.now()+'-'+Math.random().toString(36).slice(2));
    sessionStorage.setItem('jpSessionId',sid);
  }
  return sid;
}

async function liveTick(){
  await heartbeat();
  await loadLiveOnline();
}

async function heartbeat(){
  try{
    await dbUpsert('visitor_sessions?on_conflict=session_id',{session_id:getSessionId(),last_seen:new Date().toISOString()});
    // Occasionally clear out very old sessions so the table doesn't grow forever
    if(Math.random()<0.05){
      const oldCutoff=new Date(Date.now()-86400000).toISOString();
      dbDelete('visitor_sessions?last_seen=lt.'+oldCutoff).catch(()=>{});
    }
  }catch(e){console.warn('heartbeat failed (visitor_sessions table missing?):',e.message);}
}

async function loadLiveOnline(){
  const el=document.getElementById('liveOnlineCount');
  if(!el)return;
  try{
    const cutoff=new Date(Date.now()-90000).toISOString(); // active in last 90s
    const rows=await dbGet('visitor_sessions?last_seen=gte.'+cutoff+'&select=session_id');
    el.textContent=(rows||[]).length;
  }catch(e){el.textContent='-';}
}

function startClock(){
  function tick(){
    const el=document.getElementById('liveClock');
    if(!el)return;
    const d=new Date();
    const dd=String(d.getDate()).padStart(2,'0');
    const mm=String(d.getMonth()+1).padStart(2,'0');
    const yyyy=d.getFullYear();
    let h=d.getHours();const ampm=h>=12?'PM':'AM';h=h%12;if(h===0)h=12;
    const mi=String(d.getMinutes()).padStart(2,'0');
    const se=String(d.getSeconds()).padStart(2,'0');
    el.textContent='📅 '+dd+'-'+mm+'-'+yyyy+'  🕐 '+h+':'+mi+':'+se+' '+ampm;
  }
  tick();
  setInterval(tick,1000);
}

function routeMe(){
  document.getElementById('logoutBtn').classList.remove('hidden');
  document.getElementById('liveClock')?.classList.remove('hidden');
  ME.role==='admin'?showAdmin():ME.role==='teacher'?showTeacher():showParentSearch();
}
function logout(){
  ME=null;sessionStorage.removeItem('jpMe');
  document.getElementById('logoutBtn').classList.add('hidden');
  document.getElementById('liveClock')?.classList.add('hidden');
  showLanding();
}
function saveMe(o){ME=o;sessionStorage.setItem('jpMe',JSON.stringify(o));}

// ── LANDING ──────────────────────────────────
async function showLanding(){
  document.getElementById('liveClock')?.classList.add('hidden');
  setMain(`
    <div class="text-center" style="margin-bottom:20px;">
      <div style="font-size:56px;margin-bottom:12px;">🙏</div>
      <h1 style="font-size:30px;font-weight:800;color:var(--sky-deeper);margin-bottom:8px;">जैन पाठशाला</h1>
      <p style="color:#64748b;">श्री अरिहंत विकास समिति — भीलवाड़ा</p>
    </div>

    <div id="dailyQuoteDiv" class="mb-3"></div>
    <div id="panchangDiv" class="mb-3"></div>
    <div id="birthdayDiv"></div>
    <div id="winnersDiv" class="mb-3"></div>

    <div class="login-cards mb-3">
      <div class="lcard" onclick="showAdminLogin()"><div class="ic">👑</div><h3>Admin</h3><p>सम्पूर्ण प्रबंधन</p></div>
      <div class="lcard" onclick="showTeacherLogin()"><div class="ic">📚</div><h3>शिक्षक / शिक्षिका</h3><p>उपस्थिति एवं प्रदर्शन</p></div>
      <div class="lcard" onclick="showParentSearch()"><div class="ic">👨‍👩‍👧</div><h3>अभिभावक</h3><p>बच्चे की जानकारी</p></div>
    </div>

    <div id="visitorDiv" class="text-center"></div>
  `);
  loadDailyQuote();
  loadPanchang();
  loadBirthdays();
  loadLandingWinners();
  bumpVisitorCount();
}

// ── 1. VISITOR COUNTER ────────────────────────
async function bumpVisitorCount(){
  const el=document.getElementById('visitorDiv');
  try{
    // Try fetch existing counter row
    let rows=await dbGet('visitor_count?id=eq.1&select=count');
    let newCount;
    if(rows&&rows.length){
      newCount=(rows[0].count||0)+1;
      await dbPatch('visitor_count?id=eq.1',{count:newCount});
    } else {
      newCount=1;
      await dbPost('visitor_count',{id:1,count:1});
    }
    if(el)el.innerHTML='<p style="font-size:12px;color:#64748b;margin-top:10px;">👁️ कुल विज़िटर: <b style="color:var(--sky-deeper);">'+newCount+'</b></p>';
  }catch(e){
    if(el)el.innerHTML='';
    console.warn('Visitor counter table missing — run updated SQL to enable.');
  }
}

// ── 2. MONTHLY WINNERS DISPLAY ────────────────
async function loadLandingWinners(){
  const el=document.getElementById('winnersDiv');
  if(!el)return;
  try{
    const d=new Date();
    const my=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    const prevD=new Date(d.getFullYear(),d.getMonth()-1,1);
    const prevMy=`${prevD.getFullYear()}-${String(prevD.getMonth()+1).padStart(2,'0')}`;

    let data=await dbGet('monthly_awards?month_year=eq.'+my+'&select=award_type,students(name,salutation)');
    let usedMy=my;
    if(!data||!data.length){
      data=await dbGet('monthly_awards?month_year=eq.'+prevMy+'&select=award_type,students(name,salutation)');
      usedMy=prevMy;
    }
    if(!data||!data.length){el.innerHTML='';return;}
    const att=data.filter(x=>x.award_type==='attendance');

          </div>
        </div>
      </div>`;
  }catch(e){el.innerHTML='';}
}
function monthLabel(my){
  if(!my)return '';
  const [y,m]=my.split('-');
  const dt=new Date(parseInt(y),parseInt(m)-1,1);
  return dt.toLocaleDateString('hi-IN',{year:'numeric',month:'long'});
}

async function loadBirthdays(targetId='birthdayDiv'){
  const el=document.getElementById(targetId);
  if(!el)return;
  try{
    const today=new Date();
    const tomorrow=new Date(today);tomorrow.setDate(today.getDate()+1);
    const tMM=String(today.getMonth()+1).padStart(2,'0'),tDD=String(today.getDate()).padStart(2,'0');
    const mMM=String(tomorrow.getMonth()+1).padStart(2,'0'),mDD=String(tomorrow.getDate()).padStart(2,'0');

    const students=await dbGet('students?select=name,salutation,dob');
    let teachers=[];
    try{ teachers=await dbGet('teachers?select=name,salutation,dob'); }catch(e){ teachers=[]; }

    let html='';
    const checkPerson=(p,label)=>{
      if(!p.dob)return;
      const d=new Date(p.dob+'T00:00:00');
      const mm=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');
      if(mm===tMM&&dd===tDD){
        html+=`<div class="confirm-box" style="background:#fdf4ff;border-color:#e9d5ff;margin-bottom:10px;">
          <div class="ci">🎂🎉</div>
          <p style="color:#86198f;"><b>जन्मदिन मुबारक हो!</b><br>${label} ${p.salutation} ${p.name} 🎈</p>
        </div>`;
      } else if(mm===mMM&&dd===mDD){
        html+=`<div class="alert alert-info mb-3" style="text-align:center;">
          🎂 कल ${label} <b>${p.salutation} ${p.name}</b> का जन्मदिन है!
        </div>`;
      }
    };

    (students||[]).forEach(s=>checkPerson(s,'विद्यार्थी'));
    (teachers||[]).forEach(t=>checkPerson(t,'शिक्षक/शिक्षिका'));

    el.innerHTML=html;

  }catch(e){el.innerHTML='';}
}

function pkey(k,role){
  let p=window._pin||'';
  if(k==='⌫')p=p.slice(0,-1);
  else if(k===''||p.length>=4)return;
  else p+=k;
  window._pin=p;
  for(let i=0;i<4;i++){const d=document.getElementById('d'+i);if(d)d.classList.toggle('filled',i<p.length);}
  document.getElementById('perr')?.classList.add('hidden');
  if(p.length===4)setTimeout(()=>verifyPin(p,role),200);
}

async function verifyPin(pin,role){
  try{
    if(role==='admin'){
      const data=await dbGet('admin_config?select=pin&limit=1');
      if(data&&data.length&&data[0].pin===pin){
        saveMe({role:'admin'});document.getElementById('logoutBtn').classList.remove('hidden');document.getElementById('liveClock')?.classList.remove('hidden');showAdmin();
      } else pinErr();
    } else {
      const tid=document.getElementById('tSel')?.value;
      if(!tid){pinErr('पहले नाम चुनें।');return;}
      const data=await dbGet('teachers?id=eq.'+tid+'&pin=eq.'+pin+'&limit=1');
      if(data&&data.length){
        saveMe({role:'teacher',data:data[0]});document.getElementById('logoutBtn').classList.remove('hidden');document.getElementById('liveClock')?.classList.remove('hidden');showTeacher();
      } else pinErr();
    }
  }catch(e){pinErr('Error: '+e.message);}
}
function pinErr(msg){
  const el=document.getElementById('perr');
  if(el){if(msg)el.textContent=msg;el.classList.remove('hidden');}
  window._pin='';for(let i=0;i<4;i++){const d=document.getElementById('d'+i);if(d)d.classList.remove('filled');}
}

// Shared ranking computation — SAME formula as before, used by both
// the teacher's read-only ranking tables and the admin's manual selection screen.
async function computeAttendanceRanking(my){
  const monthDates=await dbGet('class_dates?month_year=eq.'+my+'&select=id,class_date,duration_minutes,is_active');
  const durById={};(monthDates||[]).forEach(d=>{durById[d.id]=d.duration_minutes||60;});
  // Only classes that are active AND have actually happened (not future-scheduled) count toward the total
  const heldActive=(monthDates||[]).filter(d=>d.is_active&&d.class_date<=today());
  const activeIds=new Set(heldActive.map(d=>d.id));
  const totalMinutes=heldActive.reduce((s,d)=>s+(d.duration_minutes||60),0)||1;

  const att=await dbGet('attendance?month_year=eq.'+my+'&status=eq.present&select=student_id,class_date_id,arrival_time,departure_time');
  const timeToMin=t=>{if(!t)return null;const[h,m]=t.split(':').map(Number);return h*60+m;};
  const minutesByStu={};
  (att||[]).forEach(r=>{
    if(!activeIds.has(r.class_date_id))return; // skip deactivated classes entirely
    const dur=durById[r.class_date_id]||60;
    const a=timeToMin(r.arrival_time),d=timeToMin(r.departure_time);
    let mins=dur; // fallback: full credit if times weren't recorded
    if(a!=null&&d!=null){mins=Math.max(0,Math.min(dur,d-a));}
    minutesByStu[r.student_id]=(minutesByStu[r.student_id]||0)+mins;
  });
  const students=await dbGet('students?select=id,name,salutation');
  const infoById={};(students||[]).forEach(s=>infoById[s.id]=s);
  return Object.entries(minutesByStu).map(([sid,mins])=>({
    id:sid,name:infoById[sid]?.name||'',salutation:infoById[sid]?.salutation||'',
    mins,ratio:mins/totalMinutes
  })).sort((a,b)=>b.ratio-a.ratio);
}

async function computePerformanceRanking(my){
  const monthDates=await dbGet('class_dates?month_year=eq.'+my+'&select=id,class_date,is_active');
  const activeIds=new Set((monthDates||[]).filter(d=>d.is_active&&d.class_date<=today()).map(d=>d.id));
  const perf=await dbGet('performance?month_year=eq.'+my+'&select=student_id,rating,class_date_id');
  const pm={};(perf||[]).forEach(r=>{
    if(!activeIds.has(r.class_date_id))return; // skip deactivated / not-yet-happened classes
    if(!pm[r.student_id])pm[r.student_id]=[];pm[r.student_id].push(r.rating);
  });
  const totalHeld=(monthDates||[]).filter(d=>d.is_active&&d.class_date<=today()).length||1;

  const ids=Object.keys(pm);
  const infoById={};let ageDaysById={};
  if(ids.length){
    const studentsInfo=await dbGet('students?id=in.('+ids.join(',')+')&select=id,name,salutation,dob');
    const todayD=new Date();
    (studentsInfo||[]).forEach(s=>{
      infoById[s.id]=s;
      if(s.dob){const d=new Date(s.dob+'T00:00:00');ageDaysById[s.id]=(todayD-d)/(1000*60*60*24);}
    });
  }
  const validAges=Object.values(ageDaysById);
  const minAgeDays=validAges.length?Math.min(...validAges):0;
  const maxAgeDays=validAges.length?Math.max(...validAges):0;

  return ids.map(id=>{
    const rs=pm[id];
    const avgRating=rs.reduce((a,b)=>a+b,0)/rs.length;
    const attendanceRatio=rs.length/totalHeld;
    const baseScore=avgRating*attendanceRatio;
    const age=ageDaysById[id];
    let ageBonus=0;
    if(age!=null && maxAgeDays>minAgeDays){
      ageBonus=(maxAgeDays-age)/(maxAgeDays-minAgeDays)*0.10; // up to 10% for youngest
    }
    return{
      id,name:infoById[id]?.name||'',salutation:infoById[id]?.salutation||'',
      avgRating,ratingCount:rs.length,score:baseScore*(1+ageBonus)
    };
  }).sort((a,b)=>b.score-a.score);
}

async function adminSave(sid,cdId,date){
  const statusEl=document.getElementById('rsa-'+sid);
  const ratingEl=document.getElementById('rsr-'+sid);
  const status=statusEl?.value||'';
  const rating=parseInt(ratingEl?.value)||0;
  const my=date.substring(0,7);
  const msgEl=document.getElementById('rsMsg');
  if(msgEl)msgEl.innerHTML='<div class="alert alert-info">⏳ सहेजा जा रहा है...</div>';
  try{
    // ATTENDANCE: if status empty ("-- चुनें --"), DELETE the record (clear it)
    if(status===''){
      const delResult=await dbDelete('attendance?student_id=eq.'+sid+'&class_date_id=eq.'+cdId);
      console.log('DELETE attendance (cleared):',delResult);
    } else {
      const ex=await dbGet('attendance?student_id=eq.'+sid+'&class_date_id=eq.'+cdId+'&select=id');
      console.log('Existing attendance check:',ex);
      if(ex&&ex.length>0){
        const patchResult=await dbPatch('attendance?student_id=eq.'+sid+'&class_date_id=eq.'+cdId,
          {status,locked:false,edited_once:false});
        console.log('PATCH attendance returned:',patchResult);
      } else {
        const postResult=await dbPost('attendance',{student_id:sid,class_date_id:cdId,date,status,month_year:my,locked:false,edited_once:false});
        console.log('POST attendance returned:',postResult);
        try{
          const stu=await dbGet('students?id=eq.'+sid+'&select=joining_date');
          if(stu?.[0]&&!stu[0].joining_date){
            await dbPatch('students?id=eq.'+sid,{joining_date:date});
          }
        }catch(e){console.error('auto joining_date failed:',e);}
      }
    }

    // PERFORMANCE: only allowed when status is 'present'. If rating is 0, or status isn't
    // present, DELETE the record (clear it) — prevents rating an absent/unmarked student.
    if(rating===0||status!=='present'){
      const delResult=await dbDelete('performance?student_id=eq.'+sid+'&class_date_id=eq.'+cdId);
      console.log('DELETE performance (cleared):',delResult);
    } else {
      const ex=await dbGet('performance?student_id=eq.'+sid+'&class_date_id=eq.'+cdId+'&select=id');
      console.log('Existing performance check:',ex);
      if(ex&&ex.length>0){
        const patchResult=await dbPatch('performance?student_id=eq.'+sid+'&class_date_id=eq.'+cdId,
          {rating,locked:false,edited_once:false});
        console.log('PATCH performance returned:',patchResult);
      } else {
        const postResult=await dbPost('performance',{student_id:sid,class_date_id:cdId,rating,month_year:my,locked:false,edited_once:false});
        console.log('POST performance returned:',postResult);
      }
    }

    if(msgEl)msgEl.innerHTML='<div class="alert alert-ok">✅ सहेजा गया!</div>';
    toast('✅ Reset हो गया!');
    setTimeout(()=>{loadRsContent(cdId,date);},1000);
  }catch(e){
    if(msgEl)msgEl.innerHTML='<div class="alert alert-err">❌ Error: '+e.message+'</div>';
    console.error('adminSave error:',e);
  }
}

async function doAddClassDate(tab){
  const date=g('cdDate');
  if(!date){merr('cderr','दिनांक आवश्यक।');return;}
  const my=date.substring(0,7);
  try{
    const inserted=await dbPost('class_dates',{class_date:date,month_year:my});
    const newId=inserted?.[0]?.id;
    // If this is a future date, make it the homepage's "next class" automatically
    if(newId && date>today()){
      try{await dbPatch('admin_config?id=eq.1',{next_class_id:newId});}
      catch(e){console.error('set next_class_id failed:',e);}
    }
    closeModal();
    if(tab==='a'){document.getElementById('aMon').value=my;loadAttDates();}
    else{document.getElementById('pMon').value=my;loadPerfDates();}
    toast('📅 '+fmtDate(date)+' जोड़ी गई ✓');
  }catch(e){
    if(e.message.includes('unique')||e.message.includes('duplicate')){merr('cderr','यह दिनांक पहले से जोड़ी जा चुकी है।');}
    else merr('cderr','Error: '+e.message);
  }
}

  const my=date.substring(0,7);
  try{
    const ids=stu.map(s=>'student_id=eq.'+s.id).join(',');
    const ex=await dbGet('attendance?class_date_id=eq.'+cdId+'&select=student_id,status,locked,edited_once,arrival_time,departure_time');
    const sm={};(ex||[]).forEach(r=>sm[r.student_id]=r);

      <div class="card-title">📅 ${fmtDate(date)} — उपस्थिति</div>

        const pStyle=isPresent
          ? "background:linear-gradient(160deg,#4ade80,#16a34a);color:#fff;box-shadow:0 2px 0 #15803d;top:2px;border:2px solid #16a34a;"
          : "background:#fff;color:#16a34a;box-shadow:0 4px 0 #f59e0b;top:0;border:2px solid #f59e0b;";

          ? "background:linear-gradient(160deg,#f87171,#dc2626);color:#fff;box-shadow:0 2px 0 #991b1b;top:2px;border:2px solid #dc2626;"
          : "background:#fff;color:#dc2626;box-shadow:0 4px 0 #f59e0b;top:0;border:2px solid #f59e0b;";

async function markAtt(sid,status,date,my,cdId){
  const msgElId='attMsg-'+cdId;
  const msgEl=document.getElementById(msgElId);

  // INSTANT visual feedback — change button colors immediately before DB call
  const pBtn=document.getElementById('ap-'+cdId+'-'+sid);
  const aBtn=document.getElementById('aa-'+cdId+'-'+sid);
  if(pBtn){
    if(status==='present'){
      pBtn.style.background='linear-gradient(160deg,#4ade80,#16a34a)';
      pBtn.style.color='#fff';pBtn.style.border='2px solid #16a34a';
      pBtn.style.boxShadow='0 2px 0 #15803d';pBtn.style.top='2px';
    } else {
      pBtn.style.background='#fff';pBtn.style.color='#16a34a';pBtn.style.border='2px solid #f59e0b';
      pBtn.style.boxShadow='0 4px 0 #f59e0b';pBtn.style.top='0';
    }
  }
  if(aBtn){
    if(status==='absent'){
      aBtn.style.background='linear-gradient(160deg,#f87171,#dc2626)';
      aBtn.style.color='#fff';aBtn.style.border='2px solid #dc2626';
      aBtn.style.boxShadow='0 2px 0 #991b1b';aBtn.style.top='2px';
    } else {
      aBtn.style.background='#fff';aBtn.style.color='#dc2626';aBtn.style.border='2px solid #f59e0b';
      aBtn.style.boxShadow='0 4px 0 #f59e0b';aBtn.style.top='0';
    }
  }

  // Show/hide the arrival-departure time row instantly based on status
  const timesDiv=document.getElementById('attTimes-'+cdId+'-'+sid);
  if(timesDiv) timesDiv.style.display = status==='present' ? 'flex' : 'none';

  try{
    const ex=await dbGet('attendance?student_id=eq.'+sid+'&class_date_id=eq.'+cdId+'&select=id,locked,edited_once,arrival_time,departure_time');
    const rec=ex?.[0];
    if(rec?.locked&&rec?.edited_once){showLockMsg(msgElId);await loadAttSheet(cdId,date);return;}
    const newEditedOnce=!!rec;
    const payload={status,locked:true,edited_once:newEditedOnce};
    if(status==='present'){
      // Default to 7:00 PM–8:00 PM unless already set (or the teacher's current field values)
      const atEl=document.getElementById('at-'+cdId+'-'+sid);
      const dtEl=document.getElementById('dt-'+cdId+'-'+sid);
      payload.arrival_time = (atEl?.value)||rec?.arrival_time||'19:00';
      payload.departure_time = (dtEl?.value)||rec?.departure_time||'20:00';
    }
    if(rec&&rec.id){
      const updated=await dbPatch('attendance?student_id=eq.'+sid+'&class_date_id=eq.'+cdId,payload);
      console.log('PATCH attendance result:',updated);
    } else {
      const inserted=await dbPost('attendance',{student_id:sid,class_date_id:cdId,date,month_year:my,...payload});
      console.log('POST attendance result:',inserted);
      // This is this student's first-ever attendance record — auto-set joining_date
      // to this class's date, unless it's already been set manually.
      try{
        const stu=await dbGet('students?id=eq.'+sid+'&select=joining_date');
        if(stu?.[0]&&!stu[0].joining_date){
          await dbPatch('students?id=eq.'+sid,{joining_date:date});
        }
      }catch(e){console.error('auto joining_date failed:',e);}
    }
    // If marked absent, clear any performance rating that may have been given by mistake
    if(status==='absent'){
      try{await dbDelete('performance?student_id=eq.'+sid+'&class_date_id=eq.'+cdId);}
      catch(e){console.error('clear performance on absent failed:',e);}
    }
    if(msgEl)msgEl.innerHTML='';
    toast('उपस्थिति सहेजी ✓',1200);
    // Refresh in background to sync lock state — colors already updated instantly above
    setTimeout(()=>loadAttSheet(cdId,date),400);
  }catch(e){
    console.error('markAtt error:',e);
    showLockMsg(msgElId,'❌ Error: '+e.message);
    await loadAttSheet(cdId,date); // revert to actual DB state on error
  }
}

async function loadPerfSheet(cdId,date){
  const el=document.getElementById('perfSheetDiv');if(!el)return;
  const stu=(window._stus||[]).filter(s=>!s.joining_date||s.joining_date<=date);
  if(!stu.length){el.innerHTML='<div class="empty"><p>इस दिनांक तक कोई विद्यार्थी प्रवेशित नहीं।</p></div>';return;}
  el.innerHTML='<div class="spinner"></div>';
  const my=date.substring(0,7);
  try{
    const ex=await dbGet('performance?class_date_id=eq.'+cdId+'&select=student_id,rating,locked,edited_once');
    const pm={};(ex||[]).forEach(r=>pm[r.student_id]=r);
    const attRows=await dbGet('attendance?class_date_id=eq.'+cdId+'&select=student_id,status');
    const attMap={};(attRows||[]).forEach(r=>attMap[r.student_id]=r.status);
    el.innerHTML=`<div class="card" style="padding:16px;">
      <div class="card-title">📅 ${fmtDate(date)} — प्रदर्शन रेटिंग</div>
      <div style="font-size:12px;color:#64748b;margin-bottom:12px;">★1=कमज़ोर ★5=श्रेष्ठ | 🔒=Lock | केवल उपस्थित विद्यार्थी को रेट किया जा सकता है</div>
      <div id="perfMsg-${cdId}" class="mb-3"></div>
      ${stu.map(s=>{
        const rec=pm[s.id];
        const locked=rec?.locked&&rec?.edited_once;
        const isPresent=attMap[s.id]==='present';
        const disabled=locked||!isPresent;
        return `<div class="att-row">
          <div class="att-name">${s.salutation} ${s.name}${locked?'<span class="locked-tag">🔒</span>':''}${!isPresent?'<span class="locked-tag" style="background:#fef2f2;border-color:#fca5a5;color:#991b1b;">अनुपस्थित</span>':''}</div>
          <div class="stars" id="st-${cdId}-${s.id}">
            ${[1,2,3,4,5].map(i=>`<span style="color:${i<=(rec?.rating||0)?'var(--gold)':'#bae6fd'};font-size:24px;cursor:${disabled?'not-allowed':'pointer'};opacity:${isPresent?'1':'.5'};"
              onclick="${locked?`showLockMsg('perfMsg-${cdId}')`:(!isPresent?`showLockMsg('perfMsg-${cdId}','⚠️ पहले विद्यार्थी को उपस्थित दर्ज करें, तभी रेटिंग दी जा सकती है।')`:`setRating('${s.id}','${my}','${cdId}',${i},'${date}')`)}">★</span>`).join('')}
          </div>
        </div>`;
      }).join('')}
    </div>`;
  }catch(e){el.innerHTML='<div class="alert alert-err">Error: '+e.message+'</div>';}
}

async function setRating(sid,my,cdId,r,date){
  const msgElId='perfMsg-'+cdId;
  const msgEl=document.getElementById(msgElId);

  // Safety check: only present students can be rated
  const attCheck=await dbGet('attendance?student_id=eq.'+sid+'&class_date_id=eq.'+cdId+'&select=status').catch(()=>null);
  if(attCheck?.[0]?.status!=='present'){
    showLockMsg(msgElId,'⚠️ पहले विद्यार्थी को उपस्थित दर्ज करें, तभी रेटिंग दी जा सकती है।');
    await loadPerfSheet(cdId,date);
    return;
  }

  // INSTANT visual feedback — fill stars immediately before DB call
  const stars=document.querySelectorAll('#st-'+cdId+'-'+sid+' span');
  stars.forEach((s,i)=>s.style.color=i<r?'var(--gold)':'#bae6fd');

  try{
    const ex=await dbGet('performance?student_id=eq.'+sid+'&class_date_id=eq.'+cdId+'&select=id,locked,edited_once');
    const rec=ex?.[0];
    if(rec?.locked&&rec?.edited_once){showLockMsg(msgElId);await loadPerfSheet(cdId,date);return;}
    const newEditedOnce=!!rec;
    if(rec&&rec.id){
      const updated=await dbPatch('performance?student_id=eq.'+sid+'&class_date_id=eq.'+cdId,
        {rating:r,locked:true,edited_once:newEditedOnce});
      console.log('PATCH performance result:',updated);
    } else {
      const inserted=await dbPost('performance',{student_id:sid,class_date_id:cdId,rating:r,month_year:my,locked:true,edited_once:false});
      console.log('POST performance result:',inserted);
    }
    if(msgEl)msgEl.innerHTML='';
    toast('रेटिंग सहेजी ✓',1200);
    setTimeout(()=>loadPerfSheet(cdId,date),400);
  }catch(e){
    console.error('setRating error:',e);
    showLockMsg(msgElId,'❌ Error: '+e.message);
    await loadPerfSheet(cdId,date);
  }
}

function showLockMsg(elId,msg){
  const el=document.getElementById(elId);
  if(el)el.innerHTML='<div class="alert alert-err">'+(msg||'🔒 यह रिकॉर्ड Lock हो चुका है। बदलने के लिए Admin से संपर्क करें।')+'</div>';
}

let _st;
async function searchStu(val){
  clearTimeout(_st);
  if(val.length<2){document.getElementById('searchRes').innerHTML='';return;}
  _st=setTimeout(async()=>{
    try{
      const data=await dbGet('students?or=(name.ilike.*'+val+'*,father_phone.ilike.*'+val+'*,mother_phone.ilike.*'+val+'*)&limit=10');
      const el=document.getElementById('searchRes');
      if(!data||!data.length){el.innerHTML='<div class="alert alert-info">कोई विद्यार्थी नहीं मिला।</div>';return;}
      el.innerHTML=data.map(s=>`
        <div onclick="gateParentView('${s.id}','${(s.father_phone||'').replace(/'/g,"")}','${(s.mother_phone||'').replace(/'/g,"")}')" style="background:#f0f9ff;border:1.5px solid #7dd3fc;border-radius:8px;padding:10px 14px;margin-top:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;">
          <div><b style="color:var(--sky-deeper)">${s.salutation} ${s.name}</b>
            <div style="font-size:12px;color:#64748b;">${s.father_name?('पिता: '+s.father_name+' | '+maskPhone(s.father_phone)):''}${s.mother_name?(' | माता: '+s.mother_name+' | '+maskPhone(s.mother_phone)):''}</div>
          </div>
          <span style="color:var(--sky-dark);">देखें →</span>
        </div>`).join('');
    }catch(e){}
  },350);
}
function maskPhone(phone){
  if(!phone)return '-';
  const digits=phone.replace(/\D/g,'');
  if(digits.length<=2)return phone;
  return digits.slice(0,-2)+'XX';
}

        <div style="font-size:13px;color:#475569;margin-bottom:14px;line-height:1.9;">
          ${s.father_name?`👨 पिता: <b>${s.father_name}</b>${s.father_phone?' ('+s.father_phone+')':''}<br>`:''}
          ${s.mother_name?`👩 माता: <b>${s.mother_name}</b>${s.mother_phone?' ('+s.mother_phone+')':''}<br>`:''}
          ${s.dob?`🎂 जन्म तिथि: ${fmtDate(s.dob)}<br>`:''}
          ${s.gotra?`🕉️ गोत्र: ${s.gotra}<br>`:''}
          ${s.blood_group?`🩸 Blood Group: ${s.blood_group}<br>`:''}
          ${s.email?`✉️ ${s.email}<br>`:''}
          ${s.address?`🏠 ${s.address}`:''}
        </div>
        <div class="stat-grid">
          <div class="stat-card"><div class="sc-val">${present}<span style="font-size:14px;"> (${pct}%)</span></div><div class="sc-label">उपस्थिति</div></div>
          <div class="stat-card"><div class="sc-val">${absent}</div><div class="sc-label">अनुपस्थिति</div></div>
          <div class="stat-card"><div class="sc-val">${total}</div><div class="sc-label">कुल कक्षाएं</div></div>
          <div class="stat-card"><div class="sc-val">${awards?.length||0} 🏆</div><div class="sc-label">पुरस्कार</div></div>
        </div>
        ${awards?.length?`<div class="alert alert-ok mb-3">🏆 ${awards.length} मासिक पुरस्कार प्राप्त!</div>`:''}
        <hr style="border:none;border-top:1.5px solid #e0f2fe;margin:16px 0;">
        <div class="card-title">माहवार उपस्थिति</div>
        ${Object.entries(byMonth).sort((a,b)=>b[0].localeCompare(a[0])).map(([m,v])=>`
          <div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #e0f2fe;">
            <span style="font-size:13px;color:#64748b;">${m}</span>
            <span style="font-size:13px;color:var(--navy-mid);">✅ ${v.p}/${v.t} <span style="color:${v.p/v.t>=.8?'#16a34a':'#f59e0b'};">(${Math.round(v.p/v.t*100)}%)</span></span>
          </div>`).join('')||'<p style="color:#64748b;font-size:13px;">कोई रिकॉर्ड नहीं।</p>'}
        <hr style="border:none;border-top:1.5px solid #e0f2fe;margin:16px 0;">
        <div class="card-title">कक्षावार रेटिंग</div>
        ${perf.map(p=>`
          <div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #e0f2fe;">
            <span style="font-size:13px;color:#64748b;">${p.class_dates?.class_date?fmtDate(p.class_dates.class_date):(p.month_year||'-')}</span>
            <div>${[1,2,3,4,5].map(i=>`<span style="color:${i<=p.rating?'var(--gold)':'#bae6fd'};font-size:18px;">★</span>`).join('')}</div>
          </div>`).join('')||'<p style="color:#64748b;font-size:13px;">कोई रेटिंग नहीं।</p>'}
      </div>`);
  }catch(e){setMain('<div class="alert alert-err">Error: '+e.message+'</div>');}
}

// ── HELPERS ──────────────────────────────────
function setMain(h){document.getElementById('appMain').innerHTML=h;}
function g(id){return document.getElementById(id)?.value?.trim()||'';}
function today(){return new Date().toISOString().split('T')[0];}
function fmtDate(isoDate){
  if(!isoDate)return '-';
  const d=new Date(isoDate+'T00:00:00');
  if(isNaN(d))return '-';
  const dd=String(d.getDate()).padStart(2,'0');
  const mm=String(d.getMonth()+1).padStart(2,'0');
  const yyyy=d.getFullYear();
  return dd+'-'+mm+'-'+yyyy;
}
function monthOpts(){
  const d=new Date(),opts=[];
  for(let i=0;i<12;i++){
    const dt=new Date(d.getFullYear(),d.getMonth()-i,1);
    const v=`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}`;
    opts.push(`<option value="${v}"${i===0?' selected':''}>${dt.toLocaleDateString('hi-IN',{year:'numeric',month:'long'})}</option>`);
  }
  return opts.join('');
}
function openModal(h){document.getElementById('modalBox').innerHTML=h;document.getElementById('modalBg').classList.remove('hidden');}
function closeModal(){document.getElementById('modalBg').classList.add('hidden');}
function merr(id,msg){const e=document.getElementById(id);if(e)e.innerHTML=`<div class="alert alert-err">${msg}</div>`;}
let _tt;
function toast(msg,dur=2500){
  let t=document.getElementById('_toast');
  if(!t){t=document.createElement('div');t.id='_toast';t.style.cssText='position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#0c4a6e,#075985);color:#fcd34d;padding:10px 22px;border-radius:30px;font-weight:700;font-size:14px;z-index:999;box-shadow:0 4px 12px rgba(12,42,78,.4);pointer-events:none;transition:opacity .3s;border:2px solid var(--gold);';document.body.appendChild(t);}
  t.textContent=msg;t.style.opacity='1';clearTimeout(_tt);_tt=setTimeout(()=>t.style.opacity='0',dur);
}
document.getElementById('modalBg').addEventListener('click',function(e){if(e.target===this)closeModal();});
</script>
